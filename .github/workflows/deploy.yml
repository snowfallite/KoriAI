name: deploy

# Every merge into main ships to the test VPS (tech.md §20.2).
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a deploy in flight is never cancelled.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The public host key of the VPS: pinned, so the deploy never talks to a spoofed server.
  VPS_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKRstYIb9R3h0DxY1cKOFxzF9bszdAd/3TCC0bKWlBa3

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: kori-api
            file: backend/Dockerfile
          - image: kori-caddy
            file: infra/caddy/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: ref
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          echo "sha=$name:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            echo "main=$name:main" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ steps.ref.outputs.sha }}
            ${{ steps.ref.outputs.main }}
          # Cached layers keep their digests, so the VPS pulls only the layers that changed.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    env:
      TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: SSH key and known host
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts
      - name: Ship the compose file and the scripts
        run: >-
          scp docker-compose.yml infra/deploy/deploy.sh infra/deploy/compose.sh
          "$TARGET:/opt/kori/"
      # The token goes on stdin: never on a command line or into the shell history of the VPS.
      - name: Deploy
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: >-
          printf '%s\n' "$GHCR_READ_TOKEN"
          | ssh "$TARGET" bash /opt/kori/deploy.sh
          "sha-${GITHUB_SHA::7}" "$GITHUB_REPOSITORY_OWNER"
