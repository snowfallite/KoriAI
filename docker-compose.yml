# Test VPS (tech.md §15.1, §20.2). deploy.sh sets KORI_TAG (sha-<short>).
# Next to this file: .env (tech.md §15.3) and postgres.env (POSTGRES_PASSWORD from DATABASE_URL).
name: kori

services:
  caddy:
    image: ghcr.io/snowfallite/kori-caddy:${KORI_TAG:?set KORI_TAG}
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  api:
    image: ghcr.io/snowfallite/kori-api:${KORI_TAG:?set KORI_TAG}
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
      # The API reads the file itself to reject unknown keys; uid 10001 must be able to read it.
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    env_file: postgres.env
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  data:
  pg_data:
  qdrant_data:
  caddy_data:
  caddy_config:
