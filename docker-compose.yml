# Test VPS (tech.md §15.1, §20.2). deploy.sh sets KORI_TAG (sha-<short>).
# Next to this file: .env (tech.md §15.3), postgres.env (POSTGRES_PASSWORD from DATABASE_URL) and
# xray/ (base.json, nodes.json from the owner's subscription; tech.md §3.5).
name: kori

services:
  caddy:
    image: ghcr.io/snowfallite/kori-caddy:${KORI_TAG:?set KORI_TAG}
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  api:
    image: ghcr.io/snowfallite/kori-api:${KORI_TAG:?set KORI_TAG}
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
      # The API reads the file itself to reject unknown keys; uid 10001 must be able to read it.
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    env_file: postgres.env
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  # The egress of the Tavily adapter (TAVILY_PROXY_URL=http://xray:8080): no port outside, only
  # tavily.com goes out, through the owner's VLESS nodes. Logs go to stdout, not to the image's
  # own config dir and log file.
  xray:
    image: ghcr.io/xtls/xray-core:26.9.30@sha256:6d30597c3e729b5dc1faac8dbc0138fbbe6d4d787bfb54120ea48f14e2e7b5ca
    restart: unless-stopped
    command: ["run", "-confdir", "/etc/kori-xray"]
    volumes:
      - ./xray/base.json:/etc/kori-xray/01_base.json:ro
      - ./xray/nodes.json:/etc/kori-xray/02_nodes.json:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  data:
  pg_data:
  qdrant_data:
  caddy_data:
  caddy_config:
