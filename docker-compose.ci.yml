# CI and e2e (tech.md §15.1, §20.1): fakes, throwaway data, the built SPA on :8080.
name: kori-ci

services:
  caddy:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    environment:
      APP_BASE_URL: http://localhost:8080
    depends_on: [api]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ci
      APP_BASE_URL: http://localhost:8080
      APP_ALLOWED_ORIGINS: http://localhost:8080
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    tmpfs: /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 2s
      timeout: 5s
      retries: 15
