<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../css/kioku-tokens.css">
<link rel="stylesheet" href="../../css/kioku.css">
<script>(function(){var h=document.documentElement;function s(){h.setAttribute("data-theme",location.hash.slice(1)||"night")}s();addEventListener("hashchange",s)})();</script><meta charset="utf-8"><title>Button — preview</title></head>
<body class="bg-ground text-ink">
<div class="grid grid-cols-[auto_1fr] items-center gap-x-10 gap-y-6 p-10 text-caps-sm caps">

  <span class="text-ink-muted">Stepped · grey</span>
  <div class="flex flex-wrap gap-4">
    <button type="button" class="ki-focus group inline-flex items-stretch text-ui normal-case text-black">
      <span class="grid w-9 place-items-center bg-grey-400 text-lead">+</span>
      <span class="bg-grey-300 px-4 py-2.5 group-hover:bg-grey-200">Add to dictionary</span>
    </button>
    <!-- hover state, shown statically -->
    <button type="button" class="ki-focus inline-flex items-stretch text-ui normal-case text-black">
      <span class="grid w-9 place-items-center bg-grey-400 text-lead">+</span>
      <span class="bg-grey-200 px-4 py-2.5">Hover</span>
    </button>
    <!-- focus state, shown statically -->
    <button type="button" class="inline-flex items-stretch text-ui normal-case text-black shadow-[var(--focus-ring)]">
      <span class="grid w-9 place-items-center bg-grey-400 text-lead">+</span>
      <span class="bg-grey-300 px-4 py-2.5">Focus</span>
    </button>
    <button type="button" disabled class="inline-flex cursor-not-allowed items-stretch text-ui normal-case text-grey-600">
      <span class="grid w-9 place-items-center bg-grey-300 text-lead">+</span>
      <span class="bg-grey-200 px-4 py-2.5">Disabled</span>
    </button>
  </div>

  <span class="text-ink-muted">Stepped · AI</span>
  <div class="flex flex-wrap gap-4">
    <button type="button" class="ki-focus group inline-flex items-stretch text-ui normal-case text-black">
      <span class="ki-ignite grid w-9 place-items-center text-lead text-white">→</span>
      <span class="ki-fade py-2.5 pr-16 pl-4 group-hover:bg-red group-hover:bg-none">Deep dive AI</span>
    </button>
    <button type="button" class="ki-focus inline-flex items-stretch text-ui normal-case text-black">
      <span class="grid w-9 place-items-center bg-red text-lead">↓</span>
      <span class="ki-fade py-2.5 pr-16 pl-4">Expand cluster</span>
    </button>
  </div>

  <span class="text-ink-muted">Site · CTA</span>
  <div class="flex flex-wrap items-center gap-4">
    <a href="#" class="ki-focus inline-flex items-center gap-6 bg-accent px-6 py-4 text-on-accent hover:bg-ink hover:text-ground">Add to Chrome <span aria-hidden="true">→</span></a>
    <a href="#" class="ki-focus inline-flex items-center gap-6 border border-line px-6 py-4 hover:bg-ink hover:text-ground">See how it works <span aria-hidden="true">→</span></a>
    <a href="#" class="ki-focus inline-flex items-center gap-2 py-4 text-ink-muted hover:text-accent"><span aria-hidden="true">→</span> Read the concept</a>
  </div>

  <span class="text-ink-muted">Icon</span>
  <div class="flex gap-2 normal-case">
    <button type="button" aria-label="Close" class="ki-focus grid size-9 place-items-center bg-white text-title text-black hover:bg-grey-200">×</button>
    <button type="button" aria-label="Add" class="ki-focus grid size-9 place-items-center bg-grey-100 text-lead text-black hover:bg-grey-200">+</button>
    <button type="button" aria-label="Listen" class="ki-focus grid size-9 place-items-center bg-grey-200 text-black hover:bg-grey-300">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="square" aria-hidden="true"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 6a2.5 2.5 0 0 1 0 4"/><path d="M12 4a5 5 0 0 1 0 8"/></svg>
    </button>
    <button type="button" aria-label="Copy" class="ki-focus grid size-9 place-items-center bg-red-deep text-white hover:bg-red hover:text-black">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="square" aria-hidden="true"><path d="M5.5 5.5h8v8h-8z"/><path d="M10.5 5.5v-3h-8v8h3"/></svg>
    </button>
  </div>
</div>
</body>
</html>
