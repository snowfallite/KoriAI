<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../css/kioku-tokens.css">
<link rel="stylesheet" href="../../css/kioku.css">
<script>(function(){var h=document.documentElement;function s(){h.setAttribute("data-theme",location.hash.slice(1)||"night")}s();addEventListener("hashchange",s)})();</script>
<meta charset="utf-8">
<title>TranslationCard — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&display=swap">
</head>
<body class="bg-ground text-ink">
<div class="p-8">
  <article class="w-[368px] bg-white text-black" aria-labelledby="kc-title">
    <header class="flex items-center justify-between py-3 pr-2 pl-4">
      <span class="text-title">Kï</span>
      <button type="button" aria-label="Close" class="ki-focus grid size-9 place-items-center text-title hover:bg-grey-200">×</button>
    </header>
    <p class="px-4 text-right text-caption">zh-Hant <span aria-hidden="true">→</span> En</p>

    <div class="mt-3 bg-red-deep px-4 pt-3 pb-3 text-white">
      <h2 id="kc-title" class="text-title">mind-blowing effect</h2>
      <div class="mt-3 flex items-center justify-between text-ui">
        <span class="flex items-center gap-2">
          <button type="button" aria-label="Listen" class="ki-focus -ml-1 grid size-6 place-items-center">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="square" aria-hidden="true"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 6a2.5 2.5 0 0 1 0 4"/><path d="M12 4a5 5 0 0 1 0 8"/></svg>
          </button>
          <span lang="zh-Hant">震撼力</span> {zhènhànlì}
        </span>
        <button type="button" aria-label="Copy" class="ki-focus grid size-6 place-items-center">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="square" aria-hidden="true"><path d="M5.5 5.5h8v8h-8z"/><path d="M10.5 5.5v-3h-8v8h3"/></svg>
        </button>
      </div>
    </div>

    <section class="px-4 pt-5">
      <h3 class="text-ui font-bold">Alternative Meanings</h3>
      <ul class="mt-3 text-ui">
        <li><span aria-hidden="true">→</span> power to astonish</li>
        <li><span aria-hidden="true">→</span> stunning impact</li>
        <li><span aria-hidden="true">→</span> overwhelming impact</li>
      </ul>
    </section>

    <section class="px-4 pt-5">
      <h3 class="text-ui font-bold">Topics</h3>
      <ul class="mt-2 flex flex-wrap text-caption">
        <li class="border border-black bg-black px-1.5 py-0.5 text-white">Impact &amp; impressions</li>
        <li class="-ml-px border border-black px-1.5 py-0.5">Theater &amp; performance</li>
        <li class="-mt-px border border-black px-1.5 py-0.5">Politics &amp; global affairs</li>
        <li class="-mt-px bg-red-deep px-1.5 py-0.5 font-bold text-white" aria-label="1 more topic">+1</li>
      </ul>
    </section>

    <footer class="mt-8 flex text-ui">
      <button type="button" class="ki-focus group flex flex-1 items-stretch">
        <span class="grid w-9 place-items-center bg-grey-400 text-lead">+</span>
        <span class="flex flex-1 items-center bg-grey-300 px-3 py-2.5 whitespace-nowrap group-hover:bg-grey-200">Add to dictionary</span>
      </button>
      <button type="button" class="ki-focus group flex items-stretch">
        <span class="ki-ignite grid w-9 place-items-center text-lead text-white">→</span>
        <span class="ki-fade flex items-center py-2.5 pr-5 pl-3 whitespace-nowrap group-hover:bg-red group-hover:bg-none">Deep dive AI</span>
      </button>
    </footer>
  </article>
</div>
</body>
</html>
