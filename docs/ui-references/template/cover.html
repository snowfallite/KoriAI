<!doctype html>
<html lang="en" data-theme="night">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/kioku.css">
<script>(function(){var h=document.documentElement;function s(){h.setAttribute("data-theme",location.hash.slice(1)||"night")}s();addEventListener("hashchange",s)})();</script>
<meta charset="utf-8">
<title>Kïoku</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--ground); color:var(--ink); font-family:var(--font-mono); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { position:absolute; top:0; left:-480px; display:block; width:960px; height:288px; }
  .s-pink { stop-color:var(--pink); }
  .s-red { stop-color:var(--red); }
  .s-clear { stop-color:var(--ground); stop-opacity:0; }
  .s-ground { stop-color:var(--ground); stop-opacity:1; }
  .slab { fill:url(#cv-hero); }
  .veil { fill:url(#cv-veil); }
  .blk { fill:var(--red); }
  .ray { stroke:var(--red); stroke-width:var(--stroke-hair); }
  .deep { fill:var(--red-deep); }
  .inkb { fill:var(--ink); }
  .words { position:absolute; left:var(--space-12); bottom:var(--space-8); max-width:420px; }
  .name { margin:0; font-size:120px; line-height:.92; font-weight:400; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 6px; font-size:13px; line-height:17px; letter-spacing:.02em; text-transform:uppercase; color:var(--ink-muted); }
</style>
</head>

<div class="cover">

<svg viewBox="0 0 960 288" width="960" height="288">
<!--
  blocks      hero slab 336×264 in pink → red (the brand's own two hues, bled off the top) · red-deep 48×120 satellite bled off the top · ink 48×24 on the slab's base line — ≈ 38% of 960×288, three hues plus ink
  arrangement one tall slab with two satellites, as the landing's hero sits over the black page: the slab dissolves into ground at its foot (grad-hero's last stop)
  pattern     pixel arches — "nested arches of stepped blocks" from the README's graphic language: three arches of red blocks 16×24 (space-4 × space-6) around the slab's centre, plus five stroke-hair rays converging low, as in the hero
  scales      sides in space-6 (24px) multiples; blocks space-4 × space-6; gaps space-4; corners radius-none (Kïoku is square)
-->

  <linearGradient id="cv-veil" x1="0" y1="0" x2="0" y2="1"><stop offset=".5" class="s-clear"/><stop offset="1" class="s-ground"/></linearGradient>
