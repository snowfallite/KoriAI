<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&amp;family=Noto+Sans+JP:wght@300&amp;display=swap">
<style>

.ki-under:hover{color:#DF342F !important}
a:focus-visible,button:focus-visible{outline:2px solid transparent;box-shadow:0 0 0 2px #FFFFFF,0 0 0 4px #000000}
.ki-panel input{outline:none}
.ki-panel input:focus{box-shadow:inset 0 -2px 0 #000000}

<div style="position: relative; display: flex; justify-content: center; padding: 44px 16px 0">
<div role="img" aria-label="Kōri" style="display: grid; grid-template-columns: repeat(7, auto); font-weight: 300; font-size: 52px; line-height: 52px">
<span aria-hidden="true" style="background-image: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 46%, rgba(255, 255, 255, 0.3) 100%); -webkit-background-clip: text; background-clip: text; color: transparent">K</span><span aria-hidden="true" style="width: 0.6em"></span><span aria-hidden="true" style="background-image: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 46%, rgba(255, 255, 255, 0.3) 100%); -webkit-background-clip: text; background-clip: text; color: transparent">Ō</span><span aria-hidden="true" style="width: 0.6em"></span><span aria-hidden="true" style="background-image: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 46%, rgba(255, 255, 255, 0.3) 100%); -webkit-background-clip: text; background-clip: text; color: transparent">R</span><span aria-hidden="true" style="width: 0.6em"></span><span aria-hidden="true" style="background-image: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 46%, rgba(255, 255, 255, 0.3) 100%); -webkit-background-clip: text; background-clip: text; color: transparent">I</span>

</div>
</div>
<div style="flex: 1"></div>

<form class="ki-panel" aria-labelledby="phone-login-title" style="position: relative; margin: 0 12px 12px; padding: 28px 20px 24px; background: #FFFFFF; color: #000000">
<div aria-hidden="true" style="height: 3px; margin: -28px -20px 25px; background-image: linear-gradient(90deg, #FE2627 0%, #FD4B61 40%, rgba(255, 255, 255, 0) 100%)"></div>
<h1 id="phone-login-title" style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 400; letter-spacing: -0.01em">Вход</h1>
<div style="display: flex; flex-direction: column; gap: 16px; margin-top: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="phone-email" style="font-size: 12px; line-height: 16px; color: #757575">Email</label>
<input id="phone-email" type="email" autocomplete="email" value="demo@example.test" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 0; background: #F6F6F6; color: #000000; font-family: inherit; font-size: 16px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="phone-password" style="font-size: 12px; line-height: 16px; color: #757575">Пароль</label>
<div style="position: relative; display: flex">
<input id="phone-password" type="password" autocomplete="current-password" value="dev-password-123" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 104px 0 14px; border: 0; background: #F6F6F6; color: #000000; font-family: inherit; font-size: 16px">
<button type="button" class="ki-quiet" aria-controls="phone-password" style="position: absolute; top: 0; right: 0; height: 52px; padding: 0 14px; border: 0; background: transparent; color: #757575; font-family: inherit; font-size: 13px; cursor: pointer">Показать</button>
</div>
</div>
</div>
<a href="#" class="ki-cta" style="display: flex; height: 56px; margin-top: 24px; color: #FFFFFF; font-size: 14px"><span aria-hidden="true" style="flex: 0 0 56px; display: flex; align-items: center; justify-content: center; background: #FE2627; color: #000000; font-size: 18px">→</span><span class="ki-cta-label" style="flex: 1; display: flex; align-items: center; padding: 0 18px; background: #000000">Войти</span></a>
<p style="margin: 16px 0 0; font-size: 13px; line-height: 18px; color: #757575">Нет аккаунта? <a href="#" class="ki-under" style="color: #000000; text-decoration: underline; text-underline-offset: 3px">Регистрация по приглашению</a></p>
</form>
