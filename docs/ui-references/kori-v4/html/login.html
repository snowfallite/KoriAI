<div style="display: flex; flex-direction: column; gap: 20px; margin-top: 32px">

</div>
<div style="display: flex; flex-direction: column; gap: 8px">

<div style="position: relative; display: flex">
<input id="login-password" type="password" autocomplete="current-password" value="dev-password-123" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 112px 0 16px; border: 0; background: #F6F6F6; color: #000000; font-family: inherit; font-size: 16px">
<button type="button" class="ki-quiet" aria-controls="login-password" style="position: absolute; top: 0; right: 0; height: 52px; padding: 0 16px; border: 0; background: transparent; color: #757575; font-family: inherit; font-size: 13px; cursor: pointer">Показать</button>
