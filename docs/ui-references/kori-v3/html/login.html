<span>Вход для закрытого круга</span>

</div>

<span aria-hidden="true" lang="ja" style="position: relative; flex: 0 0 24px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: #DF342F; color: #FFFFFF; font-family: 'Noto Serif JP', serif; font-size: 14px; line-height: 1"><span style="position: absolute; top: 2px; right: 2px; bottom: 2px; left: 2px; border: 1px solid #FFFFFF"></span>氷</span>
<span style="font-size: 18px; line-height: 22px; letter-spacing: -0.01em">Kōri</span>

</div>

<div style="display: flex; align-items: baseline; justify-content: space-between">
