<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kōri · чат на телефоне</title>
<!-- Static export of the Kōri v3 canvas (docs/ui-references/kori-v3/README.md). Visual reference, not app code. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&amp;family=Noto+Sans+JP:wght@300&amp;family=Noto+Serif+JP:wght@400&amp;display=swap">
<style>
body{margin:0;background:#000000}
a{color:inherit;text-decoration:none}
.ki-tabbar a:hover{color:#FFFFFF !important}
.ki-send:hover{background:#FE2627 !important}
a:focus-visible,button:focus-visible{outline:2px solid transparent;box-shadow:0 0 0 2px #000000,0 0 0 4px #FE2627}
.ki-composer:focus-within{box-shadow:0 0 0 2px #000000,0 0 0 4px #FE2627}
.ki-composer textarea:focus{outline:none}
.ki-composer textarea::placeholder{color:#757575}
.ki-node{transition:border-color .15s ease,color .15s ease}
.ki-node:hover,.ki-node:focus-visible{border-color:#FFFFFF !important;color:#FFFFFF !important}
.ki-hot{opacity:0;transition:opacity .2s ease}
.hot1{opacity:1}
.ki-fan:has(.ki-node:hover) .hot1,.ki-fan:has(.ki-node:focus-visible) .hot1{opacity:0}
.ki-fan:has(.n1:hover) .hot1,.ki-fan:has(.n1:focus-visible) .hot1{opacity:1}
.ki-fan:has(.n2:hover) .hot2,.ki-fan:has(.n2:focus-visible) .hot2{opacity:1}
.ki-fan:has(.n3:hover) .hot3,.ki-fan:has(.n3:focus-visible) .hot3{opacity:1}
.ki-fan:has(.n4:hover) .hot4,.ki-fan:has(.n4:focus-visible) .hot4{opacity:1}
.ki-caret{animation:ki-blink 1.1s steps(1) infinite}
.ki-ray{stroke-dasharray:1;stroke-dashoffset:1;animation:ki-draw .8s cubic-bezier(.2,.7,.2,1) forwards}
.ki-ghost{stroke-dasharray:1;stroke-dashoffset:1;animation:ki-draw 1.4s cubic-bezier(.2,.7,.2,1) forwards}
.ki-pop{opacity:0;animation:ki-pop .45s ease-out forwards}
@keyframes ki-blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@keyframes ki-draw{to{stroke-dashoffset:0}}
@keyframes ki-pop{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.ki-caret{animation:none}.ki-ray,.ki-ghost{animation:none;stroke-dashoffset:0}.ki-pop{animation:none;opacity:1}}
</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #000000; color: #FFFFFF; font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; -webkit-font-smoothing: antialiased">

<header style="height: 56px; flex: 0 0 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 16px; border-bottom: 1px solid #262626">
<a href="phone-chat.html" aria-label="Kōri" style="display: flex; align-items: center; gap: 9px">
<span aria-hidden="true" lang="ja" style="position: relative; flex: 0 0 24px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: #DF342F; color: #FFFFFF; font-family: 'Noto Serif JP', serif; font-size: 14px; line-height: 1; text-transform: none; letter-spacing: 0"><span style="position: absolute; top: 2px; right: 2px; bottom: 2px; left: 2px; border: 1px solid #FFFFFF"></span>氷</span>
<span style="font-size: 20px; line-height: 24px; letter-spacing: -0.01em">Kōri</span>
</a>
<a href="phone-chat.html" aria-label="Новый чат" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 22px">+</a>
</header>

<p style="margin: 0; padding: 12px 16px; border-bottom: 1px solid #262626; font-size: 11px; line-height: 14px; letter-spacing: 0.06em; text-transform: uppercase; color: #757575">Портфель&nbsp;&nbsp;<span style="color: #FFFFFF">1&nbsp;195&nbsp;145&nbsp;₽&nbsp;&nbsp;↑&nbsp;3,65&nbsp;%</span></p>

<main style="flex: 1; min-height: 0; padding: 32px 16px 0">
<p style="margin: 0 0 14px; font-size: 11px; line-height: 14px; letter-spacing: 0.06em; text-transform: uppercase; color: #AAAAAA">Добрый вечер, Демо</p>
<h1 style="margin: 0; font-size: 36px; line-height: 40px; letter-spacing: -0.01em; font-weight: 400">Что с портфелем<br>и почему?<span class="ki-caret" aria-hidden="true" style="display: inline-block; width: 0.45em; height: 0.8em; margin-left: 0.14em; background: #FE2627; vertical-align: -0.04em"></span></h1>

<div class="ki-fan" style="position: relative; width: 358px; height: 212px; margin-top: 28px">
<svg aria-hidden="true" width="358" height="212" viewBox="0 0 358 212" style="position: absolute; left: 0; top: 0; display: block; overflow: visible">
<defs>
<linearGradient id="kp-base" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6A6A6A"></stop><stop offset="1" stop-color="#2E2E2E"></stop></linearGradient>
<linearGradient id="kp-hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FE2627"></stop><stop offset="1" stop-color="#FE2627" stop-opacity="0.3"></stop></linearGradient>
<linearGradient id="kp-ghost" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2C2C2C"></stop><stop offset="1" stop-color="#2C2C2C" stop-opacity="0"></stop></linearGradient>
</defs>
<path class="ki-ghost" pathLength="1" d="M0 0L118 212" fill="none" stroke="url(#kp-ghost)" stroke-width="1" style="animation-delay: .05s"></path>
<path class="ki-ghost" pathLength="1" d="M0 0L58 212" fill="none" stroke="url(#kp-ghost)" stroke-width="1" style="animation-delay: .12s"></path>
<path class="ki-ray" pathLength="1" d="M0 0L223 46" fill="none" stroke="url(#kp-base)" stroke-width="1" style="animation-delay: .15s"></path>
<path class="ki-ray" pathLength="1" d="M0 0L160 94" fill="none" stroke="url(#kp-base)" stroke-width="1" style="animation-delay: .23s"></path>
<path class="ki-ray" pathLength="1" d="M0 0L152 142" fill="none" stroke="url(#kp-base)" stroke-width="1" style="animation-delay: .31s"></path>
<path class="ki-ray" pathLength="1" d="M0 0L168 190" fill="none" stroke="url(#kp-base)" stroke-width="1" style="animation-delay: .39s"></path>
<path class="ki-ray ki-hot hot1" pathLength="1" d="M0 0L223 46" fill="none" stroke="url(#kp-hot)" stroke-width="1.25" style="animation-delay: .15s"></path>
<path class="ki-ray ki-hot hot2" pathLength="1" d="M0 0L160 94" fill="none" stroke="url(#kp-hot)" stroke-width="1.25" style="animation-delay: .23s"></path>
<path class="ki-ray ki-hot hot3" pathLength="1" d="M0 0L152 142" fill="none" stroke="url(#kp-hot)" stroke-width="1.25" style="animation-delay: .31s"></path>
<path class="ki-ray ki-hot hot4" pathLength="1" d="M0 0L168 190" fill="none" stroke="url(#kp-hot)" stroke-width="1.25" style="animation-delay: .39s"></path>
<rect x="220" y="44.5" width="3" height="3" fill="#FE2627"></rect>
<rect x="157" y="92.5" width="3" height="3" fill="#6A6A6A"></rect>
<rect x="149" y="140.5" width="3" height="3" fill="#6A6A6A"></rect>
<rect x="165" y="188.5" width="3" height="3" fill="#6A6A6A"></rect>
<rect x="-3" y="-3" width="6" height="6" fill="#FE2627"></rect>
</svg>
<ul aria-label="Примеры вопросов" style="list-style: none; margin: 0; padding: 0">
<li><a href="phone-chat.html" class="ki-node n1 ki-pop" style="position: absolute; left: 225px; top: 28px; width: 133px; height: 36px; box-sizing: border-box; display: flex; align-items: center; padding: 0 12px; border: 1px solid #5A5A5A; background: #000000; color: #FFFFFF; font-size: 13px; line-height: 16px; white-space: nowrap; animation-delay: .5s">Обзор портфеля</a></li>
<li><button type="button" class="ki-node n2 ki-pop" style="position: absolute; left: 162px; top: 76px; width: 196px; height: 36px; box-sizing: border-box; display: flex; align-items: center; padding: 0 12px; border: 1px solid #333333; background: #000000; color: #DBDBDB; font-family: inherit; font-size: 13px; line-height: 16px; white-space: nowrap; cursor: pointer; animation-delay: .58s">Почему Газпром −14,7&nbsp;%</button></li>
<li><button type="button" class="ki-node n3 ki-pop" style="position: absolute; left: 154px; top: 124px; width: 204px; height: 36px; box-sizing: border-box; display: flex; align-items: center; padding: 0 12px; border: 1px solid #333333; background: #000000; color: #DBDBDB; font-family: inherit; font-size: 13px; line-height: 16px; white-space: nowrap; cursor: pointer; animation-delay: .66s">Дивиденды до конца года</button></li>
<li><button type="button" class="ki-node n4 ki-pop" style="position: absolute; left: 170px; top: 172px; width: 188px; height: 36px; box-sizing: border-box; display: flex; align-items: center; padding: 0 12px; border: 1px solid #333333; background: #000000; color: #DBDBDB; font-family: inherit; font-size: 13px; line-height: 16px; white-space: nowrap; cursor: pointer; animation-delay: .74s">МСФО ЛУКОЙЛа за 5 лет</button></li>
</ul>
</div>
</main>

<form class="ki-composer" aria-label="Новый вопрос" style="flex: 0 0 auto; margin: 0 12px 12px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 6px; background: #FFFFFF; color: #000000">
<label for="askm" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Вопрос аналитику</label>
<textarea id="askm" rows="1" placeholder="Спросите о портфеле" style="flex: 1; min-width: 0; margin: 0; border: 0; resize: none; background: transparent; padding: 8px 8px; font-family: inherit; font-size: 16px; line-height: 24px; color: #000000"></textarea>
<button type="button" class="ki-send" aria-label="Спросить" style="flex: 0 0 40px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; background: linear-gradient(90deg, #000000 0%, #FE2627 100%); color: #FFFFFF; font-family: inherit; font-size: 18px; cursor: pointer">→</button>
</form>

<nav aria-label="Разделы" class="ki-tabbar" style="flex: 0 0 64px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #262626; font-size: 10px; line-height: 12px; letter-spacing: 0.08em; text-transform: uppercase">
<a href="phone-chat.html" aria-current="page" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #FFFFFF"><span aria-hidden="true" style="position: absolute; top: -1px; left: 50%; width: 20px; height: 2px; margin-left: -10px; background: #FE2627"></span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.5 3h11v7.5H8L4.5 13v-2.5h-2z"></path></svg>Чат</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #8A8A8A"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 9.5A5.2 5.2 0 1 0 4 4.4"></path><path d="M3 2.5v3h3"></path><path d="M8 5.5v3l2 1.5"></path></svg>История</a>
<a href="portfolio.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #8A8A8A"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.5 5h11v8.5h-11z"></path><path d="M5.8 5V2.5h4.4V5"></path><path d="M2.5 8.5h11"></path></svg>Портфель</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #8A8A8A"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"></path><path d="M5 3v3M10.5 6.5v3M7 10v3"></path></svg>Настройки</a>
</nav>
</div>
</body>
</html>
