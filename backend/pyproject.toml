[project]
name = "kori-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "gigachat>=0.2.3,<0.3",
    "grpcio>=1.84.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.6,<2",
    "langchain-gigachat>=0.5.1,<0.6",
    "playwright>=1.63.0",
    "procrastinate>=3.10,<3.11",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "selectolax>=1.0.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "sse-starlette>=3.5.0",
    "starlette>=1.7.0",
    "structlog>=26.1.0",
    "t-tech-investments>=1.51.0",
    "tavily-python>=0.8.4",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false
native-tls = true

[[tool.uv.index]]
name = "tbank"
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
explicit = true

[tool.uv.sources]
t-tech-investments = { index = "tbank" }

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.9",
    "types-grpcio>=1.84.0.20260928",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S", "PTH", "DTZ", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Pydantic copies field defaults per instance; ruff cannot see that Contract is a BaseModel.
"app/contracts/**" = ["RUF012"]
# Autogenerated revisions keep long SQL literals on one line.
"migrations/versions/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
# Tests import the repo-level scripts package.
mypy_path = "$MYPY_CONFIG_FILE_DIR/.."

# The Tavily SDK ships no types.
[[tool.mypy.overrides]]
module = ["tavily", "tavily.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = ["--strict-markers", "--import-mode=importlib", "--allow-hosts=127.0.0.1,::1"]
asyncio_mode = "auto"
# The protobuf modules of the T-Invest SDK warn about their own deprecated fields on import.
filterwarnings = ['ignore:.*\.figi is deprecated:DeprecationWarning']
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast tests without services",
    "property: Hypothesis property-based tests",
    "contract: HTTP, SSE, job and port contracts",
    "integration: real Postgres and Qdrant",
    "agent: ScriptedChatModel scenarios",
    "golden: parser snapshots",
]

[tool.deptry]
known_first_party = ["app"]

[tool.deptry.per_rule_ignores]
# SQLAlchemy loads psycopg from the URL; uvicorn runs from the command line.
DEP002 = ["psycopg", "uvicorn"]
