[project]
name = "kori-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "starlette>=1.7.0",
    "structlog>=26.1.0",
    "t-tech-investments>=1.51.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false
native-tls = true

[[tool.uv.index]]
name = "tbank"
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
explicit = true

[tool.uv.sources]
t-tech-investments = { index = "tbank" }

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S", "PTH", "DTZ", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Autogenerated revisions keep long SQL literals on one line.
"migrations/versions/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
# Tests import the repo-level scripts package.
mypy_path = "$MYPY_CONFIG_FILE_DIR/.."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = ["--strict-markers", "--import-mode=importlib", "--allow-hosts=127.0.0.1,::1"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast tests without services",
    "property: Hypothesis property-based tests",
    "contract: HTTP, SSE, job and port contracts",
    "integration: real Postgres and Qdrant",
    "agent: ScriptedChatModel scenarios",
    "golden: parser snapshots",
]

[tool.deptry]
known_first_party = ["app"]

[tool.deptry.per_rule_ignores]
# L-04 needs the SDK locked from S1-01; code imports it from S1-09.
# SQLAlchemy loads psycopg from the URL; uvicorn runs from the command line.
DEP002 = ["t-tech-investments", "psycopg", "uvicorn"]
