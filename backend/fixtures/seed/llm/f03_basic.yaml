# Сценарии ScriptedChatModel (§8.3) для F-03: чат без инструментов, ответ текстом. Регулярка ищет
# слова вопроса: перед ним в том же сообщении идёт служебный контекст (дата, брокер, счета, стиль
# ответа), поэтому его слова в регулярки не годятся.
- match: {purpose: agent_step, user_regex: "(?i)дюраци"}
  steps:
    - text: "Дюрация показывает, сколько лет в среднем инвестор ждёт возврата вложенного в облигацию с учётом купонов.\n\nЧем дюрация больше, тем сильнее цена облигации отвечает на изменение ставок."
  usage: {prompt_tokens: 640, completion_tokens: 52, precached_prompt_tokens: 0}
# Без инструментов графика нет: плейсхолдер [[c1]] неизвестен, postprocess убирает его с
# предупреждением unknown_placeholder (§9.9).
- match: {purpose: agent_step, user_regex: "(?i)нарисуй"}
  steps:
    - text: "Нарисовать график пока не получится: данных портфеля в этом разговоре нет.\n\n[[c1]]"
  usage: {prompt_tokens: 610, completion_tokens: 24, precached_prompt_tokens: 0}
