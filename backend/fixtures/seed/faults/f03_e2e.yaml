# FaultPlan (§8.1) стенда e2e, FAKE_FAULTS в docker-compose.ci.yml. Фейковая модель отвечает через
# 3 с, иначе ответ приходит за миллисекунды и e2e «отмена» (F-03) не успевает нажать «Остановить».
# Фильтр по тексту вопроса не годится: вопрос идёт в одном сообщении со служебным контекстом
# (domains/agent/context.py), поэтому задержка ложится на каждый шаг агента.
rules:
  - method: chat_model
    mode: latency
    latency_ms: 3000
    times: 1000000
    match: {purpose: agent_step}
