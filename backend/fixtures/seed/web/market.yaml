# Ответы фейка веб-поиска (§8.4) о рынке в целом: индекс, ключевая ставка, дивиденды ЛУКОЙЛа.
# search по нормализованному запросу, extract, crawl и map по URL.
# Синтетические данные сида (S1-10) на зарезервированных доменах example.*.
search:
  - query: индекс мосбиржи
    hits:
      - url: https://markets.example.org/2026/10/imoex-week
        title: Индекс Мосбиржи завершил неделю ростом
        content: >-
          Индекс Мосбиржи вырос за неделю на фоне спроса на акции нефтегазового сектора.
          Объём торгов остался ниже среднего за год.
        score: 0.88
        published_date: 2026-10-02
      - url: https://news.example.com/2026/09/market-review
        title: Обзор рынка акций за сентябрь
        content: >-
          В сентябре лидерами роста стали акции золотодобытчиков, отстали металлурги.
          Аналитики ждут сезона отчётности за третий квартал.
        score: 0.8
        published_date: 2026-09-30
  - query: ключевая ставка цб
    hits:
      - url: https://news.example.com/2026/09/key-rate
        title: Банк России сохранил ключевую ставку
        content: >-
          Совет директоров Банка России сохранил ключевую ставку и отметил замедление
          инфляции. Следующее заседание по ставке пройдёт в конце октября.
        score: 0.9
        published_date: 2026-09-12
  - query: лукойл дивиденды
    hits:
      - url: https://markets.example.org/2026/08/lukoil-dividends
        title: ЛУКОЙЛ рекомендовал промежуточные дивиденды
        content: >-
          Совет директоров ЛУКОЙЛа рекомендовал промежуточные дивиденды за первое полугодие.
          Реестр акционеров закроется в декабре.
        score: 0.86
        published_date: 2026-08-28
    images:
      - url: https://markets.example.org/img/lukoil-station.png
        description: АЗС ЛУКОЙЛ на трассе
extract:
  - url: https://news.example.com/2026/09/key-rate
    content: |
      # Банк России сохранил ключевую ставку

      Совет директоров Банка России сохранил ключевую ставку и отметил замедление инфляции.
      Регулятор допускает снижение ставки на ближайших заседаниях, если инфляция продолжит
      замедляться.
  - url: https://markets.example.org/2026/08/lukoil-dividends
    content: |
      # ЛУКОЙЛ рекомендовал промежуточные дивиденды

      Совет директоров ЛУКОЙЛа рекомендовал промежуточные дивиденды за первое полугодие.
      Реестр акционеров закроется в декабре, выплата пройдёт в январе.
