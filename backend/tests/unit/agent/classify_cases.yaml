# Размеченные вопросы для classify_rules (F-05 AC 1; tech.md §9.3, §9.4): правила дают верный
# интент с уверенностью от 0.8 хотя бы на 90% фраз, остальные отдают Lite (уверенность ниже 0.8).
# Бумаги и компании взяты из seed/tinvest/instruments.yaml.
# smalltalk: приветствие, благодарность, прощание без задачи.
- {text: "Привет!", intent: smalltalk}
- {text: "Добрый вечер", intent: smalltalk}
- {text: "Спасибо, всё понятно", intent: smalltalk}
- {text: "Как дела?", intent: smalltalk}
- {text: "Пока, до завтра", intent: smalltalk}
# help: вопросы о самом сервисе.
- {text: "Что ты умеешь?", intent: help}
- {text: "Как подключить токен Т-Инвестиций?", intent: help}
- {text: "Откуда ты берёшь данные?", intent: help}
- {text: "Какие вопросы тебе можно задавать?", intent: help}
- {text: "Помоги разобраться, как пользоваться чатом", intent: help}
# portfolio_status: что лежит в портфеле и сколько стоит, без вопроса «почему».
- {text: "Что у меня в портфеле?", intent: portfolio_status}
- {text: "Сколько сейчас стоит мой портфель?", intent: portfolio_status}
- {text: "Покажи мои позиции на ИИС", intent: portfolio_status}
- {text: "Какие облигации лежат на моём брокерском счёте?", intent: portfolio_status}
- {text: "Сколько я заплатил комиссий за этот год?", intent: portfolio_status}
- {text: "Покажи таблицу моих акций по стоимости", intent: portfolio_status}
# portfolio_analysis: почему портфель такой, его риск и результат.
- {text: "Что с моим портфелем и почему?", intent: portfolio_analysis}
- {text: "Почему мой портфель упал за неделю?", intent: portfolio_analysis}
- {text: "Какой риск у моего портфеля?", intent: portfolio_analysis}
- {text: "Насколько диверсифицирован мой портфель?", intent: portfolio_analysis}
- {text: "Какие позиции сильнее всего тянут портфель вниз?", intent: portfolio_analysis}
- {text: "Обзор портфеля: структура и вклад позиций", intent: portfolio_analysis}
# instrument_quote: цена, курс или график цены одного инструмента.
- {text: "Сколько стоит SBER?", intent: instrument_quote}
- {text: "Какая сейчас цена акций Газпрома?", intent: instrument_quote}
