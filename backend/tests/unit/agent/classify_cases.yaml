- {text: "Сравни SBER и VTBR", intent: compare}
- {text: "Что лучше по дивидендам: Газпром или ЛУКОЙЛ?", intent: compare}
- {text: "Сравни доходность ROSN, LKOH и TATN за 3 года", intent: compare}
