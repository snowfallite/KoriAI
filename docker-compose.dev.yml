# Dev stack (tech.md §15.1): just dev. Every *_MODE defaults to fake (§15.3).
# The SPA runs on the host (pnpm dev) and proxies /api to port 8000. Ports stay on loopback:
# the dev credentials are public.
name: kori-dev

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000",
              "--no-access-log", "--reload", "--reload-dir", "app"]
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
      QDRANT_URL: http://qdrant:6333
      # A public dev key: it seals only the made-up token of the seed demo (just seed).
      TINVEST_TOKEN_KEYS: k1:a29yaS1kZXYtb25seS10b2tlbi1rZXktMzItYnl0ZXM=
    volumes:
      - ./backend/app:/app/app
      # just seed and the fakes read the fixtures of the working tree.
      - ./backend/fixtures:/app/fixtures:ro
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-trixie
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 2s
      timeout: 5s
      retries: 15

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ["127.0.0.1:6333:6333"]
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  data:
  pg_data:
  qdrant_data:
